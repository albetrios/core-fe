name: PR Governance

on:
  pull_request:
    types: [opened, edited, synchronize, reopened]

# NO `concurrency:` BLOCK HERE — ON PURPOSE. Do not add one back.
#
# This job is named `Checks`, which branch protection requires
# (.github/rulesets/main.json). Unlike every other PR workflow this one also
# triggers on `edited`, so ONE head sha can get two runs: release-please
# force-pushes the branch and rewrites the PR body in the same instant, firing
# `synchronize` + `edited` together. A concurrency group cancels one of that
# pair, leaving a `cancelled` check run named `Checks` on the LIVE head commit
# beside its successful twin. Branch protection resolves a required context to
# the newest check suite, so whenever the cancelled twin is newer the PR is
# blocked with every check visibly green and no way to tell why (#319 sat
# blocked until the cancelled run was re-run by hand).
#
# Cancelling bought nothing here: the runs it killed were for the CURRENT head
# sha, not a superseded one, and this job finishes in ~15s. Runs for genuinely
# superseded commits are left to finish — their check runs land on a sha
# nothing evaluates.

permissions:
  contents: read
  pull-requests: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: ${{ vars.FORCE_JAVASCRIPT_ACTIONS_TO_NODE24 || 'true' }}

jobs:
  pr-quality:
    name: Checks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Skip the conventional-commits title check when the PR title starts with
      # `Merge ` (e.g. `Merge main into feature/foo` from an internal merge of a
      # parent branch into a child branch). Commitlint's defaultIgnores already
      # skips these on push, so the title gate would otherwise be the only place
      # a `Merge ...` title is rejected.
      - name: Validate PR title (conventional commits)
        if: ${{ !startsWith(github.event.pull_request.title, 'Merge ') }}
        uses: amannn/action-semantic-pull-request@48f256284bd46cdaab1048c3721360e808335d50 # v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          types: |
            feat
            fix
            docs
            style
            refactor
            perf
            test
            build
            ci
            chore
            revert

      - name: Sync PR size label
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9
        with:
          script: |
            // Reconcile, never churn: work out the label FIRST, then touch only
            // what is actually wrong. With no concurrency group (see the note at
            // the top of this file) two runs can reconcile one head sha at the
            // same time, so this has to converge rather than remove-then-add —
            // the old order left the PR briefly unlabelled and made a twin run's
            // removeLabel 404.
            const SIZE_PREFIX = 'size/';
            const { data: files } = await github.rest.pulls.listFiles({
              owner: context.repo.owner,
              repo: context.repo.repo,
              pull_number: context.issue.number,
              per_page: 100,
            });
            const changes = files.reduce((sum, file) => sum + file.additions + file.deletions, 0);
            let sizeLabel = 'size/small';
            if (changes > 500) sizeLabel = 'size/x-large';
            else if (changes > 200) sizeLabel = 'size/large';
            else if (changes > 50) sizeLabel = 'size/medium';
            const { data: existing } = await github.rest.issues.listLabelsOnIssue({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const present = existing.map((labelItem) => labelItem.name);
            if (!present.includes(sizeLabel)) {
              await github.rest.issues.addLabels({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                labels: [sizeLabel],
              });
            }
            const stale = present.filter(
              (name) => name.startsWith(SIZE_PREFIX) && name !== sizeLabel,
            );
            for (const name of stale) {
              try {
                await github.rest.issues.removeLabel({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  name,
                });
              } catch (error) {
                // A twin run for this same head sha got there first. 404 means
                // the label is already gone, which is the state we wanted.
                if (error.status !== 404) throw error;
              }
            }

      # Branch names are repo-controlled, but pass them through env anyway —
      # never interpolate event data directly into run: scripts.
      - name: Guard .env files
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref || github.base_ref || 'main' }}
        run: |
          git fetch origin "${BASE_REF}" --depth=1 2>/dev/null || true
          # Only .env.example is committed (CLAUDE.md → Environment Variables).
          # Every other .env* is gitignored — deploys inject env from GitHub
          # Environments — so none (.env, .env.development, .env.production,
          # .env.local, .env.*.backup, …) may ever reach a PR diff.
          ENV_FILES=$(git diff --name-only "origin/${BASE_REF}...HEAD" 2>/dev/null \
            | grep -E '^\.env(\.|$)' \
            | grep -vE '^\.env\.example$' || true)
          if [ -n "$ENV_FILES" ]; then
            echo "::error::Environment files detected in PR diff: $ENV_FILES"
            echo "Remove these from the commit. Only .env.example is committed; every other .env* is gitignored (deploys use GitHub Environments)."
            exit 1
          fi

      - name: Apply path labels
        uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          repo-token: ${{ secrets.GITHUB_TOKEN }}
          configuration-path: .github/labeler.yml
